# Configuration nginx du conteneur (montée sur /etc/nginx/conf.d/default.conf).
server {
    listen 80;
    root /usr/share/nginx/html;
    index index.html;

    # Fichiers du dépôt qui ne font pas partie du site : .git, .env.prod, docker-compose.yml…
    location ~ /\. { return 404; }
    location ~* \.(ya?ml|md|conf|command)$ { return 404; }

    location / {
        try_files $uri $uri/ =404;
    }

    # Templates, logos et scripts : mis en cache côté navigateur
    location ~* \.(png|jpe?g|webp|svg)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
    location ~* \.(css|js)$ {
        expires 1h;
    }

    gzip on;
    gzip_types text/css application/javascript image/svg+xml;
}
